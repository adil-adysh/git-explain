[package]
name = "git-explain"
version = "0.2.1"
edition = "2021"
description = "Accessible local explanations for changed source code"
license = "Apache-2.0"
repository = "https://github.com/adil-adysh/git-explain"
homepage = "https://github.com/adil-adysh/git-explain"

[dependencies]
anyhow = "1"
async-trait = "0.1"
sha2 = "0.10"
fs2 = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
directories = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tree-sitter = "0.25"
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-c = "0.23.4"
tree-sitter-cpp = "0.23.4"
tree-sitter-java = "0.23.5"
tree-sitter-go = "0.23.4"
tree-sitter-javascript = "0.23.1"
tree-sitter-python = "0.23.6"
tree-sitter-rust = "0.23"
tree-sitter-typescript = "0.23.2"
tree-sitter-hcl = "=1.1.0"
tree-sitter-yaml = "=0.7.2"
tree-sitter-json = "=0.24.8"
tree-sitter-containerfile = "=0.9.2"
tree-sitter-bash = "=0.25.1"
tree-sitter-powershell = "=0.26.4"
tree-sitter-kotlin-ng = "=1.1.0"
toml = "0.8"
toml_edit = "0.22"
webbrowser = "1"

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "adil-adysh <adil-adysh@users.noreply.github.com>"
copyright = "2026 adil-adysh"
license-file = ["LICENSE", "0"]
extended-description = """\
git-explain reads complete source files or explains semantic changes in a local browser.
Source extraction and Git analysis stay local; only the code sections requested
in the browser are sent to the selected model endpoint."""
depends = "git"
section = "utils"
priority = "optional"
assets = [
    ["target/release/git-explain", "/usr/bin/git-explain", "755"],
    ["README.md", "/usr/share/doc/git-explain/README.md", "644"],
    ["LICENSE", "/usr/share/doc/git-explain/LICENSE", "644"],
    ["docs/releases.md", "/usr/share/doc/git-explain/releases.md", "644"],
]

[package.metadata.generate-rpm]
release = "1"
auto-req = "no"
require-sh = false
assets = [
    { source = "target/release/git-explain", dest = "/usr/bin/git-explain", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/git-explain/README.md", mode = "644", doc = true },
    { source = "docs/releases.md", dest = "/usr/share/doc/git-explain/releases.md", mode = "644", doc = true },
    { source = "LICENSE", dest = "/usr/share/licenses/git-explain/LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.requires]
git = "*"
