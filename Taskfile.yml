version: '3'

vars:
  FORCE: '{{.FORCE | default "false"}}'

tasks:
  default:
    desc: Run formatting checks and the full test suite.
    cmds:
      - task: check

  check:
    desc: Run formatting, tests, and whitespace checks.
    cmds:
      - cargo fmt -- --check
      - cargo test
      - git diff --check

  build:
    aliases: [build-dev]
    desc: Build the development binary.
    cmds:
      - cargo build

  build-release:
    desc: Build the optimized release binary.
    cmds:
      - cargo build --release

  test-live-ollama:
    desc: Run the opt-in real Ollama context and OpenAI-compatibility probe (set GIT_EXPLAIN_TEST_OLLAMA_UNLOAD_AFTER=true to unload it afterwards).
    cmds:
      - cargo test --test live_context live_ollama -- --ignored --nocapture

  test-live-llama-cpp:
    desc: Run the opt-in real llama.cpp OpenAI-compatibility probe.
    cmds:
      - cargo test --test live_context live_llama_cpp -- --ignored --nocapture

  test-live-context:
    desc: Run all opt-in real model-server context probes serially, with one configured model per server.
    cmds:
      - cargo test --test live_context -- --ignored --nocapture --test-threads=1

  install:
    aliases: [install-release]
    desc: Build and install the release binary into the user-local Git bin directory.
    cmds:
      - task: build-release
      - task: _install-binary
        vars:
          CONFIGURATION: release
          FORCE: '{{.FORCE}}'

  install-dev:
    desc: Build and install the development binary into the user-local Git bin directory.
    cmds:
      - task: build
      - task: _install-binary
        vars:
          CONFIGURATION: debug
          FORCE: '{{.FORCE}}'

  _install-binary:
    internal: true
    vars:
      CONFIGURATION: '{{.CONFIGURATION | default "release"}}'
      FORCE: '{{.FORCE | default "false"}}'
    platforms: [windows]
    cmds:
      - pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -Configuration {{.CONFIGURATION}} -Force:{{.FORCE}}
