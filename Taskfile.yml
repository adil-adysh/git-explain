version: '3'

vars:
  FORCE: '{{.FORCE | default "false"}}'

tasks:
  default:
    desc: Run formatting checks and the full test suite.
    cmds:
      - task: check

  check:
    desc: Check frontend, Rust formatting, tests, and whitespace.
    cmds:
      - task: frontend-check
      - cargo fmt -- --check
      - cargo test
      - python scripts/test_release.py
      - git diff --check

  frontend-install:
    desc: Install locked frontend build dependencies (Node 24 recommended).
    cmds:
      - npm --prefix frontend ci

  frontend-build:
    desc: Rebuild the frontend bundle embedded in Rust binaries.
    cmds:
      - npm --prefix frontend run build

  frontend-check:
    desc: Check Svelte/TypeScript and rebuild the bundled assets.
    cmds:
      - npm --prefix frontend run check
      - task: frontend-build

  build:
    aliases: [build-dev]
    desc: Install locked frontend dependencies, rebuild the UI, and build the development binary.
    cmds:
      - task: frontend-install
      - task: frontend-build
      - cargo build

  test-browser:
    desc: Build the application and run Chromium interaction tests (requires npm ci and npx playwright install chromium).
    cmds:
      - npm run test:browser

  build-release:
    desc: Install locked frontend dependencies, rebuild the UI, and build the optimized release binary.
    cmds:
      - task: frontend-install
      - task: frontend-build
      - cargo build --release

  test-live-ollama:
    desc: Run the opt-in real Ollama context and OpenAI-compatibility probe (set GIT_EXPLAIN_TEST_OLLAMA_UNLOAD_AFTER=true to unload it afterwards).
    cmds:
      - cargo test --test live_context live_ollama -- --ignored --nocapture

  test-live-llama-cpp:
    desc: Run the opt-in real llama.cpp OpenAI-compatibility probe.
    cmds:
      - cargo test --test live_context live_llama_cpp -- --ignored --nocapture

  test-live-context:
    desc: Run all opt-in real model-server context probes serially, with one configured model per server.
    cmds:
      - cargo test --test live_context -- --ignored --nocapture --test-threads=1

  install:
    aliases: [install-release]
    desc: Rebuild the UI and release binary, then install into the user-local Git bin directory.
    cmds:
      - task: build-release
      - task: _install-binary
        vars:
          CONFIGURATION: release
          FORCE: '{{.FORCE}}'

  install-dev:
    desc: Rebuild the UI and development binary, then install into the user-local Git bin directory.
    cmds:
      - task: build
      - task: _install-binary
        vars:
          CONFIGURATION: debug
          FORCE: '{{.FORCE}}'

  _install-binary:
    internal: true
    vars:
      CONFIGURATION: '{{.CONFIGURATION | default "release"}}'
      FORCE: '{{.FORCE | default "false"}}'
    cmds:
      - cmd: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1 -Configuration {{.CONFIGURATION}} -Force:{{.FORCE}}
        platforms: [windows]
      - cmd: bash scripts/install.sh --configuration {{.CONFIGURATION}} --force {{.FORCE}}
        platforms: [linux, darwin]
