name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser-tests: true
          - os: windows-latest
            browser-tests: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run release packaging unit tests
        run: |
          python scripts/test_release.py
          python scripts/test_native_packages.py

      - name: Run Linux installer regression tests
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/test_install.sh

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt

      - name: Install musl tools and target
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check
      - run: npm --prefix frontend run build
      - name: Verify committed frontend bundle
        shell: bash
        run: |
          git diff --exit-code -- frontend/dist

      - run: cargo fmt -- --check
      - run: cargo test --locked
      - run: cargo build --locked

      - name: Verify musl build
        if: matrix.os == 'ubuntu-latest'
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo check --locked --target x86_64-unknown-linux-musl

      - name: Run browser tests
        if: matrix.browser-tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:browser

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && matrix.browser-tests
        with:
          name: browser-test-results-${{ matrix.os }}
          path: test-results/

  native-packages:
    name: Native Packages (Debian & RPM)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run packaging unit tests
        run: |
          python scripts/test_release.py
          python scripts/test_native_packages.py

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl tools
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install pinned packaging tools
        run: bash scripts/install-package-tools.sh

      - name: Build release musl binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Package release archives and native packages
        run: |
          TAG=$(python3 -c 'import tomllib; from pathlib import Path; print("v" + tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"])')
          echo "Packaging for tag: ${TAG}"
          python3 scripts/package-release.py \
            --target x86_64-unknown-linux-musl \
            --name linux-x86_64-musl \
            --tag "${TAG}" \
            --canonical-alias linux-x86_64 \
            --smoke-test
          python3 scripts/package-native.py \
            --tag "${TAG}" \
            --dist-dir dist

      - name: Run native package container smoke tests
        run: |
          TAG=$(python3 -c 'import tomllib; from pathlib import Path; print("v" + tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"])')
          bash scripts/test-native-packages.sh dist "${TAG}"
